name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npm run build
      - name: Check bundle version
        run: |
          node --check dist/wiser-rooms-card.js
          node -e 'const fs = require("node:fs"); const v = require("./package.json").version; const info = require("./dist/build-info.json"); if (!fs.readFileSync("dist/wiser-rooms-card.js", "utf8").startsWith(`/*! WISER-CARD-VERSION wiser-rooms-card ${v} */`)) throw new Error("Bundle version mismatch"); if (info.version !== v) throw new Error("Build info version mismatch");'
